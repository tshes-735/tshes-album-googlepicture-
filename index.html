<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>活動相簿 - 臺中市東勢區東新國民小學</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    [v-cloak] { display: none !important; }
    body {
      background-color: #F8FAFC;
      color: #0F172A;
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', -apple-system, BlinkMacSystemFont, sans-serif;
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-slate-50">
  <div id="app" v-cloak class="h-screen flex flex-col max-w-6xl w-full mx-auto bg-white sm:my-2 sm:h-[calc(100vh-1rem)] sm:rounded-2xl sm:border sm:border-slate-200 sm:shadow-sm overflow-hidden">
    
    <!-- 頂部固定 Header（純淨唯讀版，已移除設定按鈕） -->
    <header class="bg-[#0F172A] text-white px-4 py-3 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-2.5">
        <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 text-sky-400">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
        </span>
        <h1 class="text-lg font-bold tracking-wide text-white">活動相簿</h1>
        <span v-if="state.academicYear" class="text-xs font-medium px-2 py-0.5 rounded-full bg-sky-500/20 text-sky-300 border border-sky-400/30">
          {{ state.academicYear }}學年度
        </span>
      </div>

      <div class="flex items-center">
        <span class="font-mono text-xs tracking-widest px-2.5 py-1 rounded border border-slate-600 bg-slate-800/80 text-slate-300">
          35mm SHUTTER
        </span>
      </div>
    </header>

    <!-- 中間主要相簿輪播區 -->
    <main class="flex-1 overflow-y-auto px-4 py-4 flex flex-col justify-between bg-white relative">
      
      <!-- 播放/暫停控制鈕 + 載入狀態 -->
      <div class="flex items-center justify-between mb-2">
        <button @click="toggleAutoplay" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-slate-800 text-white text-xs font-medium hover:bg-slate-700 transition-colors shadow-sm">
          <span v-if="state.isPlaying">❚❚ 輪播中</span>
          <span v-else>▶ 已暫停</span>
        </button>
        <span v-if="loading" class="text-xs text-sky-600 font-medium animate-pulse">正在同步最新活動相簿...</span>
      </div>

      <!-- 3 欄式 4:3 相簿卡片網格 -->
      <div v-if="visibleAlbums.length > 0" class="grid grid-cols-1 sm:grid-cols-3 gap-4 my-auto">
        <a v-for="album in visibleAlbums" :key="album.id" :href="album.url" target="_blank" rel="noopener noreferrer"
           class="group block rounded-xl overflow-hidden bg-white border border-slate-100 hover:border-sky-300 shadow-sm hover:shadow-md transition-all duration-200">
          <!-- 嚴格 4:3 裁切容器 -->
          <div class="w-full aspect-[4/3] bg-slate-100 overflow-hidden relative">
            <img v-if="album.coverUrl"
                 :src="album.coverUrl"
                 :alt="album.title"
                 @error="handleImgError($event, album)"
                 class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-300" />
            <div v-else class="w-full h-full flex flex-col items-center justify-center text-slate-400 bg-slate-100">
              <span class="text-2xl mb-1">📷</span>
              <span class="text-xs">點擊開啟雲端相簿</span>
            </div>
          </div>
          <!-- 相簿資料夾名稱 -->
          <div class="p-2.5 bg-white">
            <h2 class="text-sm sm:text-base font-bold text-slate-800 group-hover:text-sky-700 truncate" :title="album.title">
              {{ album.title }}
            </h2>
          </div>
        </a>
      </div>

      <!-- 載入中/空狀態提示 -->
      <div v-else class="flex-1 flex flex-col items-center justify-center text-center py-8 text-slate-400">
        <p class="text-sm font-medium">{{ loading ? '正在讀取雲端相簿，請稍候...' : '目前尚無公開活動相簿' }}</p>
      </div>

      <!-- 底部：分頁圓點 + 更多活動相簿按鈕 -->
      <div class="mt-3 pt-2 flex items-center justify-between gap-2">
        <div class="w-24 hidden sm:block"></div>

        <!-- 輪播分頁圓點 -->
        <div v-if="totalPages > 1" class="flex items-center justify-center gap-1.5 flex-wrap mx-auto">
          <button v-for="page in totalPages" :key="page" @click="goToPage(page - 1)"
                  :class="currentPage === (page - 1) ? 'w-6 h-6 bg-[#0F172A] text-white font-bold' : 'w-5 h-5 bg-slate-200 text-slate-600 hover:bg-slate-300'"
                  class="rounded-full text-xs flex items-center justify-center transition-all">
            {{ page }}
          </button>
        </div>

        <!-- 右下角：自動連結至當學年度雲端資料夾 -->
        <a :href="state.yearFolderUrl" target="_blank" rel="noopener noreferrer"
           class="ml-auto inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-[#0F172A] hover:bg-slate-800 text-white text-xs font-bold tracking-wide shadow-sm transition-colors shrink-0">
          <span>更多活動相簿</span>
          <span>↗</span>
        </a>
      </div>
    </main>

  </div>

  <script>
    const { createApp, ref, reactive, computed, watch, onMounted } = Vue;
    const STORAGE_KEY = 'tshes_album_cache_v2';
    // 已直接寫死綁定東新國小專屬 Google Apps Script 網址
    const FIXED_GAS_URL = 'https://script.google.com/macros/s/AKfycbyTcL4PNzxz6WP7Sid4tim_s-bLmaJthymNE5voYzs6hbnhjb1IYDSUm0sWWMFOwitQLg/exec';

    createApp({
      setup() {
        const loading = ref(false);
        const currentPage = ref(0);
        let timer = null;

        const defaultState = {
          academicYear: new Date().getMonth() + 1 >= 8 ? new Date().getFullYear() - 1911 : new Date().getFullYear() - 1912,
          yearFolderUrl: 'https://drive.google.com/drive/folders/1FsI1tT8nhs0li6AQSYzmidMr3IOMQOdt?usp=drive_link',
          isPlaying: true,
          albums: []
        };

        const loadState = () => {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
              const parsed = JSON.parse(raw);
              return Object.assign({}, defaultState, parsed);
            }
          } catch (e) {}
          return Object.assign({}, defaultState);
        };

        const state = reactive(loadState());

        watch(state, (val) => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
              academicYear: val.academicYear,
              yearFolderUrl: val.yearFolderUrl,
              isPlaying: val.isPlaying,
              albums: val.albums
            }));
          } catch (e) {}
        }, { deep: true });

        const pageSize = 3;
        const totalPages = computed(() => Math.max(1, Math.ceil(state.albums.length / pageSize)));
        const visibleAlbums = computed(() => {
          const start = currentPage.value * pageSize;
          return state.albums.slice(start, start + pageSize);
        });

        const fetchAlbums = async () => {
          loading.value = true;
          try {
            const res = await fetch(FIXED_GAS_URL);
            const data = await res.json();
            if (data.status === 'ok' && Array.isArray(data.albums)) {
              state.academicYear = data.academicYear || state.academicYear;
              state.yearFolderUrl = data.yearFolderUrl || state.yearFolderUrl;
              state.albums = data.albums;
              currentPage.value = 0;
            }
          } catch (err) {
          } finally {
            loading.value = false;
          }
        };

        const handleImgError = (event, album) => {
          if (album.backupCoverUrl && event.target.src !== album.backupCoverUrl) {
            event.target.src = album.backupCoverUrl;
          } else {
            event.target.style.display = 'none';
          }
        };

        const startAutoplay = () => {
          stopAutoplay();
          timer = setInterval(() => {
            if (state.isPlaying && totalPages.value > 1) {
              currentPage.value = (currentPage.value + 1) % totalPages.value;
            }
          }, 5000);
        };

        const stopAutoplay = () => {
          if (timer) clearInterval(timer);
        };

        const toggleAutoplay = () => {
          state.isPlaying = !state.isPlaying;
        };

        const goToPage = (idx) => {
          currentPage.value = idx;
          startAutoplay();
        };

        onMounted(() => {
          startAutoplay();
          fetchAlbums();
        });

        return {
          state,
          loading,
          currentPage,
          totalPages,
          visibleAlbums,
          handleImgError,
          toggleAutoplay,
          goToPage
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
