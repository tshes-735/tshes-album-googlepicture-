<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>活動相簿 - 臺中市東勢區東新國民小學</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    [v-cloak] { display: none !important; }
    body {
      background-color: #F8FAFC;
      color: #0F172A;
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    input, textarea, select { user-select: text; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
  <script>
    (function() {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = 180;
        canvas.height = 180;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#0F172A';
        ctx.fillRect(0, 0, 180, 180);
        ctx.strokeStyle = '#38BDF8';
        ctx.lineWidth = 10;
        ctx.strokeRect(36, 52, 108, 76);
        ctx.beginPath();
        ctx.arc(90, 90, 22, 0, Math.PI * 2);
        ctx.stroke();
        var iconUrl = canvas.toDataURL('image/png');
        var appleIcon = document.createElement('link');
        appleIcon.rel = 'apple-touch-icon';
        appleIcon.href = iconUrl;
        document.head.appendChild(appleIcon);
        var manifest = {
          name: '東新國小活動相簿',
          short_name: '活動相簿',
          start_url: '.',
          display: 'standalone',
          background_color: '#F8FAFC',
          theme_color: '#0F172A',
          icons: [{ src: iconUrl, sizes: '180x180', type: 'image/png' }]
        };
        var manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
        document.head.appendChild(manifestLink);
      } catch (e) {}
    })();
  </script>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-slate-50">
  <div id="app" v-cloak class="h-screen flex flex-col max-w-6xl w-full mx-auto bg-white sm:my-2 sm:h-[calc(100vh-1rem)] sm:rounded-2xl sm:border sm:border-slate-200 sm:shadow-sm overflow-hidden">
    
    <!-- 頂部固定 Header（還原截圖深海藍質感 + 35mm SHUTTER 標籤） -->
    <header class="bg-[#0F172A] text-white px-4 py-3 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-2.5">
        <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 text-sky-400">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
        </span>
        <h1 class="text-lg font-bold tracking-wide text-white">活動相簿</h1>
        <span v-if="state.academicYear" class="text-xs font-medium px-2 py-0.5 rounded-full bg-sky-500/20 text-sky-300 border border-sky-400/30">
          {{ state.academicYear }}學年度
        </span>
      </div>

      <div class="flex items-center gap-2">
        <span class="hidden sm:inline-block font-mono text-xs tracking-widest px-2.5 py-1 rounded border border-slate-600 bg-slate-800/80 text-slate-300">
          35mm SHUTTER
        </span>
        <button @click="state.showSettings = true" title="相簿同步與備份設定" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- 中間主要相簿輪播區 -->
    <main class="flex-1 overflow-y-auto px-4 py-4 flex flex-col justify-between bg-white relative">
      
      <!-- 播放/暫停控制鈕 + 載入狀態 -->
      <div class="flex items-center justify-between mb-2">
        <button @click="toggleAutoplay" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-slate-800 text-white text-xs font-medium hover:bg-slate-700 transition-colors shadow-sm">
          <span v-if="state.isPlaying">❚❚ 輪播中</span>
          <span v-else>▶ 已暫停</span>
        </button>
        <span v-if="loading" class="text-xs text-sky-600 font-medium animate-pulse">正在同步雲端最新相簿...</span>
      </div>

      <!-- 3 欄式 4:3 相簿卡片網格 -->
      <div v-if="visibleAlbums.length > 0" class="grid grid-cols-1 sm:grid-cols-3 gap-4 my-auto">
        <a v-for="album in visibleAlbums" :key="album.id" :href="album.url" target="_blank" rel="noopener noreferrer"
           class="group block rounded-xl overflow-hidden bg-white border border-slate-100 hover:border-sky-300 shadow-sm hover:shadow-md transition-all duration-200">
          <!-- 嚴格 4:3 裁切容器 -->
          <div class="w-full aspect-[4/3] bg-slate-100 overflow-hidden relative">
            <img v-if="album.coverUrl"
                 :src="album.coverUrl"
                 :alt="album.title"
                 @error="handleImgError($event, album)"
                 class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-300" />
            <div v-else class="w-full h-full flex flex-col items-center justify-center text-slate-400 bg-slate-100">
              <span class="text-2xl mb-1">📷</span>
              <span class="text-xs">點擊開啟雲端相簿</span>
            </div>
          </div>
          <!-- 相簿資料夾名稱 -->
          <div class="p-2.5 bg-white">
            <h2 class="text-sm sm:text-base font-bold text-slate-800 group-hover:text-sky-700 truncate" :title="album.title">
              {{ album.title }}
            </h2>
          </div>
        </a>
      </div>

      <!-- 空狀態提示 -->
      <div v-else class="flex-1 flex flex-col items-center justify-center text-center py-8 text-slate-500">
        <p class="text-sm font-medium mb-2">目前尚未讀取到雲端相簿資料</p>
        <button @click="state.showSettings = true" class="px-3.5 py-1.5 rounded-lg bg-sky-600 text-white text-xs font-semibold hover:bg-sky-700">
          點此貼上 Google Apps Script 網址
        </button>
      </div>

      <!-- 底部：分頁圓點 + 更多活動相簿按鈕 -->
      <div class="mt-3 pt-2 flex items-center justify-between gap-2">
        <div class="w-24 hidden sm:block"></div>

        <!-- 輪播分頁圓點 -->
        <div v-if="totalPages > 1" class="flex items-center justify-center gap-1.5 flex-wrap mx-auto">
          <button v-for="page in totalPages" :key="page" @click="goToPage(page - 1)"
                  :class="currentPage === (page - 1) ? 'w-6 h-6 bg-[#0F172A] text-white font-bold' : 'w-5 h-5 bg-slate-200 text-slate-600 hover:bg-slate-300'"
                  class="rounded-full text-xs flex items-center justify-center transition-all">
            {{ page }}
          </button>
        </div>

        <!-- 右下角：自動連結至當學年度雲端資料夾 -->
        <a :href="state.yearFolderUrl" target="_blank" rel="noopener noreferrer"
           class="ml-auto inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-[#0F172A] hover:bg-slate-800 text-white text-xs font-bold tracking-wide shadow-sm transition-colors shrink-0">
          <span>更多活動相簿</span>
          <span>↗</span>
        </a>
      </div>
    </main>

    <!-- 管理與備份設定彈窗 (點擊右上角齒輪開啟) -->
    <div v-if="state.showSettings" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-xl border border-slate-200 max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between pb-3 border-b border-slate-100">
          <h3 class="text-base font-bold text-slate-900">雲端同步與備份管理</h3>
          <button @click="state.showSettings = false" class="text-slate-400 hover:text-slate-700 text-lg font-bold px-2">✕</button>
        </div>

        <form @submit.prevent="saveAndSync" class="mt-4 space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Google Apps Script 網頁應用程式網址</label>
            <input v-model.trim="state.gasUrl" type="url" placeholder="https://script.google.com/macros/s/..."
                   class="w-full text-base px-3 py-2 rounded-xl border border-slate-300 focus:outline-none focus:border-sky-600" />
            <p class="text-xs text-slate-500 mt-1">部署 GAS 後貼上網址，系統將自動依每年 8 月切換學年度相簿。</p>
          </div>

          <div class="flex gap-2">
            <button type="submit" class="flex-1 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-sm font-bold shadow-sm">
              儲存並立即同步雲端
            </button>
          </div>
        </form>

        <!-- 本地備份與還原區塊 -->
        <div class="mt-5 pt-4 border-t border-slate-100">
          <p class="text-xs font-bold text-slate-700 mb-2">設定與快取資料安全備份 (JSON)</p>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" @click="exportBackup" class="py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold">
              ⬇ 匯出備份檔
            </button>
            <label class="py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold text-center cursor-pointer">
              ⬆ 還原備份檔
              <input type="file" accept=".json" @change="importBackup" class="hidden" />
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- 懸浮 Toast 提示 -->
    <div v-if="toast.visible" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full bg-slate-900 text-white text-xs font-medium shadow-lg transition-opacity">
      {{ toast.message }}
    </div>

  </div>

  <script>
    const { createApp, ref, reactive, computed, watch, onMounted } = Vue;
    const STORAGE_KEY = 'tshes_album_widget_v1';

    createApp({
      setup() {
        const loading = ref(false);
        const currentPage = ref(0);
        let timer = null;

        const toast = reactive({ visible: false, message: '' });
        const showToast = (msg) => {
          toast.message = msg;
          toast.visible = true;
          setTimeout(() => { toast.visible = false; }, 3000);
        };

        // 預設帶入你提供的 115 學年度相簿連結與範例
        const defaultState = {
          gasUrl: '',
          academicYear: new Date().getMonth() + 1 >= 8 ? new Date().getFullYear() - 1911 : new Date().getFullYear() - 1912,
          yearFolderUrl: 'https://drive.google.com/drive/folders/1FsI1tT8nhs0li6AQSYzmidMr3IOMQOdt?usp=drive_link',
          isPlaying: true,
          showSettings: false,
          albums: []
        };

        const loadState = () => {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
              const parsed = JSON.parse(raw);
              return Object.assign({}, defaultState, parsed, { showSettings: false });
            }
          } catch (e) {}
          return Object.assign({}, defaultState);
        };

        const state = reactive(loadState());

        // 支援網址參數 ?api=GAS網址 直接免設定載入
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('api')) {
          state.gasUrl = urlParams.get('api');
        }

        watch(state, (val) => {
          try {
            const toSave = {
              gasUrl: val.gasUrl,
              academicYear: val.academicYear,
              yearFolderUrl: val.yearFolderUrl,
              isPlaying: val.isPlaying,
              albums: val.albums
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
          } catch (e) {}
        }, { deep: true });

        const pageSize = 3;
        const totalPages = computed(() => Math.max(1, Math.ceil(state.albums.length / pageSize)));
        const visibleAlbums = computed(() => {
          const start = currentPage.value * pageSize;
          return state.albums.slice(start, start + pageSize);
        });

        const fetchAlbums = async (manual = false) => {
          if (!state.gasUrl) return;
          loading.value = true;
          try {
            const res = await fetch(state.gasUrl);
            const data = await res.json();
            if (data.status === 'ok' && Array.isArray(data.albums)) {
              state.academicYear = data.academicYear || state.academicYear;
              state.yearFolderUrl = data.yearFolderUrl || state.yearFolderUrl;
              state.albums = data.albums;
              currentPage.value = 0;
              if (manual) showToast('已成功同步 ' + state.academicYear + ' 學年度共 ' + data.albums.length + ' 本相簿');
            } else if (manual) {
              showToast('同步異常：' + (data.message || '請確認資料夾權限'));
            }
          } catch (err) {
            if (manual) showToast('連線失敗，請檢查 GAS 部署權限是否設為「所有人」');
          } finally {
            loading.value = false;
          }
        };

        const saveAndSync = () => {
          state.showSettings = false;
          fetchAlbums(true);
        };

        const handleImgError = (event, album) => {
          if (album.backupCoverUrl && event.target.src !== album.backupCoverUrl) {
            event.target.src = album.backupCoverUrl;
          } else {
            event.target.style.display = 'none';
          }
        };

        const startAutoplay = () => {
          stopAutoplay();
          timer = setInterval(() => {
            if (state.isPlaying && totalPages.value > 1) {
              currentPage.value = (currentPage.value + 1) % totalPages.value;
            }
          }, 5000);
        };

        const stopAutoplay = () => {
          if (timer) clearInterval(timer);
        };

        const toggleAutoplay = () => {
          state.isPlaying = !state.isPlaying;
          showToast(state.isPlaying ? '已開啟自動輪播' : '已暫停輪播');
        };

        const goToPage = (idx) => {
          currentPage.value = idx;
          startAutoplay();
        };

        const exportBackup = () => {
          try {
            const dateStr = new Date().toISOString().slice(0, 10);
            const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '東新國小相簿設定備份_' + dateStr + '.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast('備份檔已匯出');
          } catch (e) {
            showToast('匯出失敗');
          }
        };

        const importBackup = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              const data = JSON.parse(ev.target.result);
              if (data.gasUrl !== undefined) state.gasUrl = data.gasUrl;
              if (Array.isArray(data.albums)) state.albums = data.albums;
              if (data.yearFolderUrl) state.yearFolderUrl = data.yearFolderUrl;
              showToast('備份已成功還原');
              if (state.gasUrl) fetchAlbums(false);
            } catch (err) {
              showToast('備份檔格式錯誤');
            }
          };
          reader.readAsText(file);
        };

        onMounted(() => {
          startAutoplay();
          if (state.gasUrl) {
            fetchAlbums(false);
          }
        });

        return {
          state,
          loading,
          toast,
          currentPage,
          totalPages,
          visibleAlbums,
          saveAndSync,
          handleImgError,
          toggleAutoplay,
          goToPage,
          exportBackup,
          importBackup
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
